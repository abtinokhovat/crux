<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Asks inbox and decision room</title>
<link rel="stylesheet" href="shared.css">
<style>
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 50px); }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } .nav { display: none; } }
.nav { border-right: 1.5px solid var(--line); background: var(--paper); padding: 14px 12px; }
.nav h4 { margin: 14px 4px 6px; font: 600 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.nav a { display: flex; align-items: center; gap: 8px; padding: 7px 8px; color: var(--ink); font-size: 13px; text-decoration: none; }
.nav a:hover { background: var(--fill); }
.nav a.on { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.nav a b { margin-left: auto; font: 600 10.5px var(--mono); background: var(--ink); color: #fff; padding: 1px 6px; }
.nav a .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.roles { display: flex; gap: 4px; flex-wrap: wrap; }
.role { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border: 1.5px solid var(--line-2); background: var(--paper); cursor: pointer; font-size: 12px; }
.role.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.main { padding: 20px 24px 80px; max-width: 1240px; width: 100%; }
.split { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }
.ask-item { display: block; padding: 12px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; text-align: left; background: var(--paper); border-left: 4px solid transparent; width: 100%; border-top: 0; border-right: 0; }
.ask-item.on { border-left-color: var(--accent); background: var(--accent-bg); }
.ask-item.done { opacity: 0.55; }
.ask-item .top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.ask-item .top time { margin-left: auto; font: 11px var(--mono); color: var(--ink-3); }
.ask-item p { margin: 6px 0 0; font-size: 13.5px; font-weight: 600; line-height: 1.4; }
.focus { background: var(--paper); border: 1.5px solid var(--line); }
.focus-h { padding: 14px 18px; border-bottom: 1.5px solid var(--line); }
.focus-h .from { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.focus-h h2 { margin: 10px 0 4px; font-size: 21px; line-height: 1.35; letter-spacing: -0.01em; }
.focus-b { padding: 16px 18px; display: grid; gap: 16px; }
.tldr { border-left: 4px solid var(--agent); background: var(--agent-bg); padding: 10px 14px; font-size: 13.5px; }
.tldr ul { margin: 6px 0 0; padding-left: 18px; }
.tldr .k { font: 700 10px var(--mono); letter-spacing: 0.08em; color: var(--agent); }
.answers { display: flex; gap: 8px; flex-wrap: wrap; }
.ans { padding: 10px 16px; border: 1.5px solid var(--line-2); background: var(--paper); cursor: pointer; font-weight: 600; }
.ans.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.lbl { font: 600 10.5px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.opick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opick button { padding: 10px; border: 1.5px solid var(--line-2); background: var(--paper); text-align: left; cursor: pointer; }
.opick button.on { border: 2.5px solid var(--green); background: var(--green-bg); }
.prog { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--ink-2); }
.prog .bar { flex: 1; height: 6px; }
.prog .bar span { background: var(--ink); }
.zero { text-align: center; padding: 60px 20px; }
.zero b { display: block; font-size: 40px; color: var(--green); }
.room-head { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: stretch; margin-bottom: 18px; }
@media (max-width: 900px) { .room-head { grid-template-columns: minmax(0, 1fr); } }
.q { border: 2px solid var(--warn); background: var(--warn-bg); padding: 14px 16px; }
.q small { font: 700 10.5px var(--mono); letter-spacing: 0.08em; color: #fff; background: var(--warn); padding: 3px 7px; }
.q h1 { margin: 8px 0 4px; font-size: 20px; line-height: 1.35; }
.ring { border: 1.5px solid var(--line); background: var(--paper); display: grid; place-items: center; padding: 10px; text-align: center; }
.ring svg { width: 110px; height: 110px; }
.ring .t { font: 600 11px var(--mono); color: var(--ink-2); letter-spacing: 0.04em; text-transform: uppercase; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.who-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.who-tbl th { font: 11px var(--mono); color: var(--ink-2); font-weight: 400; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-2); }
.who-tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.who-tbl tr:nth-child(even) td { background: var(--fill); }
.pickcell { display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--mono); }
.pickcell i { width: 16px; height: 16px; display: grid; place-items: center; font-style: normal; color: #fff; font-size: 10px; }
.confbar { width: 60px; height: 5px; background: var(--line-2); display: inline-block; vertical-align: middle; margin-left: 4px; }
.confbar span { display: block; height: 100%; background: var(--ink); }
.cons { display: grid; gap: 8px; }
.cons .r { display: grid; grid-template-columns: 26px 1fr 34px; gap: 8px; align-items: center; font-size: 13px; }
.cons .bar { height: 22px; }
.cons .bar span { display: flex; align-items: center; padding-left: 6px; gap: 2px; }
.brief { padding: 16px 14px 12px; font-size: 13.5px; }
.brief p { margin: 0 0 8px; }
.brief sup { font: 600 9px var(--mono); color: var(--agent); }
.newq { display: grid; gap: 10px; }
.queue .task { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); align-items: start; }
.queue .task:last-child { border-bottom: 0; }
.queue .task .k { font: 600 10px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--agent); }
.queue .task.done { opacity: 0.5; }
.diff { font: 12px/1.6 var(--mono); background: var(--fill); border: 1px solid var(--line-2); padding: 8px 10px; margin-top: 6px; }
.diff .del { color: var(--err); text-decoration: line-through; display: block; }
.diff .add { color: var(--green); display: block; }
.accepted { border: 2px solid var(--green); background: var(--green-bg); padding: 20px; }
.accepted h2 { margin: 6px 0; font-size: 22px; }
.chg { display: grid; gap: 6px; margin-top: 12px; font-size: 13.5px; }
.chg div { display: flex; gap: 8px; align-items: baseline; }
.chg i { font-style: normal; color: var(--green); font-weight: 700; }
</style>
</head>
<body>
<header class="pt-top">
  <a class="pt-brand" href="index.html"><i>ADR</i></a>
  <div class="pt-crumbs"><span>abtinokhovat/x</span>/<b id="crumb">inbox</b></div>
  <span class="pt-proto">Prototype C · Asks inbox</span>
  <div class="roles" id="roles"></div>
</header>
<div class="app">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<script src="data.js"></script>
<script>
const { esc, av, who, ref, linkify, toast } = H;
const ST = STORY;
const ROLES = [["mehdi-ops", "Contributor"], ["abtinokhovat", "Decider"], ["advisor", "Agent"]];
const S = {
  role: new URLSearchParams(location.search).get("as") || "mehdi-ops",
  view: null, askIdx: 0, answers: {}, pick: "C", conf: 80, sent: [], decided: false, confirm: false, tasks: new Set(), newOpen: false, drafted: false,
};
const MYASKS = [
  { id: "q2", from: "advisor", adr: "0020", text: "Is NATS on the Darkube marketplace managed, or only installed into our namespace?", choices: ["Managed by Hamravesh", "Only installed — we run it", "Not sure"], opt: "B", age: "1h", tldr: ["Team is choosing the v1 broker: Redpanda (A), NATS (B) or PostgreSQL only (C).", "Leaning C (3 of 4). Your answer decides if B stays in the race.", "Claim #7 on B depends on this."] },
  { id: "q4", from: "abtinokhovat", adr: "0020", text: "Can PostgreSQL on Hamravesh keep 14 days of raw rows at 500 msg/s without a bigger plan?", choices: ["Yes, current plan", "Needs the next plan", "Not sure"], opt: "C", age: "40m", tldr: ["C needs raw rows kept 14 days (from @reza-data).", "That is about 600 M rows; partitioned by day per ADR-0016.", "If storage costs jump, the decision may change."] },
  { id: "q5", from: "sara-dev", adr: "0017", text: "Should rate-limit tokens live in Redis or PostgreSQL rows for v1?", choices: ["Redis", "PostgreSQL rows", "Not sure"], opt: null, age: "2d", tldr: ["ADR-0017 is open; send limits per account and per provider.", "Redis is “coming soon” as managed on Hamravesh (U)."] },
];

function roles() {
  document.getElementById("roles").innerHTML = ROLES.map(([h, l]) => `<button class="role ${S.role === h ? "on" : ""}" data-role="${h}">${av(h, "sm")}${l}</button>`).join("");
}

function nav() {
  const mine = MYASKS.filter((a) => !S.answers[a.id]).length;
  const decisions = [
    ["0020", "Message broker for v1", S.decided ? "var(--green)" : "var(--accent)", S.decided ? "accepted" : "in review"],
    ["0017", "Rate limits and adapter config", "var(--warn)", "open"],
    ["0019", "Hosting: Hamravesh or bare metal", "var(--warn)", "open"],
    ...(S.drafted ? [["0021", "Realtime push transport", "var(--ink-3)", "draft"]] : []),
  ];
  const view = S.view ?? (S.role === "abtinokhovat" ? "room" : S.role === "advisor" ? "queue" : "inbox");
  document.getElementById("nav").innerHTML = `<a href="#" data-new style="justify-content:center;border:1.5px solid var(--ink);font-weight:600">＋ New decision</a>
  <h4>You</h4>
  <a href="#" data-view="inbox" class="${view === "inbox" ? "on" : ""}">Asks for you ${mine ? `<b>${mine}</b>` : ""}</a>
  ${S.role === "abtinokhovat" ? `<a href="#" data-view="room" class="${view === "room" ? "on" : ""}">Deciding <b>1</b></a>` : ""}
  ${S.role === "advisor" ? `<a href="#" data-view="queue" class="${view === "queue" ? "on" : ""}">Agent queue <b>${5 - S.tasks.size}</b></a>` : ""}
  <h4>Decisions in flight</h4>${decisions.map(([id, t, c, s]) => `<a href="#" data-view="${id === "0020" ? "room" : "inbox"}"><span class="st" style="background:${c}"></span><span><span class="mono dim" style="font-size:11px">${id}</span> ${esc(t)}<br><span class="dim" style="font-size:11px">${s}</span></span></a>`).join("")}
  <h4>Team</h4>${Object.entries(ST.people).map(([h, p]) => `<a href="#">${av(h, "sm")}<span class="mono" style="font-size:12px">@${h}</span></a>`).join("")}`;
  return view;
}

// ── contributor: focused asks ──
function inbox() {
  const open = MYASKS.filter((a) => !S.answers[a.id]);
  const cur = open[0];
  const done = MYASKS.length - open.length;
  const list = MYASKS.map((a) => `<button class="ask-item ${cur && a.id === cur.id ? "on" : ""} ${S.answers[a.id] ? "done" : ""}"><div class="top">${av(a.from, "sm")} @${a.from} asked · ${ref(a.adr)}<time>${a.age}</time></div><p>${esc(a.text)}</p>${S.answers[a.id] ? `<div class="mono" style="font-size:11px;color:var(--green);margin-top:4px">✓ ${esc(S.answers[a.id])}</div>` : ""}</button>`).join("");
  const focus = cur ? `<div class="focus"><div class="focus-h"><div class="from">${av(cur.from)} ${who(cur.from)} asks you · ${ref(cur.adr)} ${cur.opt ? `· about option <span class="opt-key" style="width:18px;height:18px;font-size:10px">${cur.opt}</span>` : ""}</div><h2>${esc(cur.text)}</h2><div class="prog"><span>${done + 1} of ${MYASKS.length}</span><span class="bar"><span style="width:${(done / MYASKS.length) * 100}%"></span></span><span>~2 min each</span></div></div>
  <div class="focus-b">
    <div class="tldr"><span class="k">TL;DR BY @ADVISOR — YOU DON'T NEED TO READ THE THREAD</span><ul>${cur.tldr.map((t) => `<li>${linkify(t)}</li>`).join("")}</ul></div>
    <div><div class="lbl">Your answer</div><div class="answers">${cur.choices.map((c) => `<button class="ans ${S.cur === c ? "on" : ""}" data-ans="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>
    <div><div class="lbl">Why — becomes an argument others can weigh</div><textarea class="textarea" id="why" placeholder="One or two sentences. Link a doc, a dashboard, a quote from the provider…"></textarea>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--ink-2)"><label><input type="checkbox" checked> Add as ${cur.opt ? `argument on option ${cur.opt}` : "comment"}</label><label><input type="checkbox"> I can share evidence later</label></div></div>
    ${cur.adr === "0020" ? `<div><div class="lbl">Your pick for ADR-0020 (optional)</div><div class="opick">${ST.options.map((o) => `<button class="${S.pick === o.key ? "on" : ""}" data-pick="${o.key}"><b>${o.key}</b> ${esc(o.name)}</button>`).join("")}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--ink-2)">Confidence <input type="range" min="0" max="100" value="${S.conf}" id="conf" style="flex:1"> <span class="mono" id="confv">${S.conf}%</span></div></div>` : ""}
    <div style="display:flex;justify-content:space-between;align-items:center"><button class="btn btn--ghost" data-act="skip">Not me — suggest someone</button><span style="display:flex;gap:8px"><button class="btn" data-act="later">Later</button><button class="btn btn--primary" data-act="submit">Send answer →</button></span></div>
  </div></div>` : `<div class="focus zero"><b>✓</b><h2 style="margin:6px 0">Inbox zero</h2><p class="muted">Your ${MYASKS.length} answers went to the deciders. @advisor added them as arguments with your name.</p><button class="btn" data-reset>Replay demo</button></div>`;
  return `<div class="split"><section class="pn"><div class="pn-head"><span class="pn-id">?</span><h3>Asks for you</h3><span class="pn-meta">${open.length} open</span></div><div class="pn-body flush">${list}</div></section>${focus}</div>`;
}

// ── decider: decision room ──
function room() {
  if (S.decided) return accepted();
  const people = ["abtinokhovat", "sara-dev", "mehdi-ops", "reza-data", "lena-fe"];
  const ans = S.answers.q2 ? 1 : 0;
  const inputs = Object.values(ST.picks).filter(Boolean).length;
  const ready = Math.round(((inputs / 5) * 0.5 + ((2 + ans) / 3) * 0.3 + 0.2 * 0.75) * 100);
  const C = 2 * Math.PI * 46;
  const ring = `<svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--line-2)" stroke-width="10"/><circle cx="55" cy="55" r="46" fill="none" stroke="var(--green)" stroke-width="10" stroke-dasharray="${(ready / 100) * C} ${C}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-family="var(--mono)" font-weight="700" font-size="22" fill="var(--ink)">${ready}%</text></svg>`;
  const color = { A: "var(--accent)", B: "#b4307a", C: "var(--green)" };
  const rows = people.map((h) => { const p = ST.picks[h]; return `<tr><td>${av(h, "sm")} <span class="mono">@${h}</span><div class="dim" style="font-size:11.5px">${esc(ST.people[h].role)}</div></td><td>${p ? `<span class="pickcell"><i style="background:${color[p.opt]}">${p.opt}</i>${Math.round(p.conf * 100)}%<span class="confbar"><span style="width:${p.conf * 100}%"></span></span></span>` : `<span class="dim">—</span>`}</td><td>${p ? esc(p.why) : `<span class="dim">No input yet.</span> <button class="btn btn--sm" data-act="nudge" data-h="${h}">Ask</button>`}</td></tr>`; }).join("");
  const n = { A: 0, B: 0, C: 0 }, wsum = { A: 0, B: 0, C: 0 };
  Object.values(ST.picks).forEach((p) => p && (n[p.opt]++, (wsum[p.opt] += p.conf)));
  const cons = ST.options.map((o) => `<div class="r"><span class="opt-key">${o.key}</span><span class="bar"><span style="width:${(wsum[o.key] / 4) * 100}%;background:${color[o.key]}">${Object.entries(ST.picks).filter(([, p]) => p?.opt === o.key).map(([h]) => av(h, "sm")).join("")}</span></span><span class="mono">${n[o.key]}</span></div>`).join("");
  return `<div class="room-head"><div class="q"><small>YOU DECIDE · ADR-0020 · DUE ${ST.adr.due.toUpperCase()}</small><h1>${esc(ST.adr.question)}</h1><div class="chips">${ST.adr.related.map((r) => ref(r.id)).join("")}</div></div><div class="ring">${ring}<div class="t">ready to decide</div><div class="dim mono" style="font-size:11px">${inputs}/5 picks · ${2 + ans}/3 asks</div></div></div>
  <div class="grid2">
    <div style="display:grid;gap:18px">
      <section class="pn"><div class="pn-head"><span class="pn-id">W</span><h3>Who thinks what</h3><span class="pn-meta">pick · confidence · reason</span></div><div class="pn-body flush"><table class="who-tbl"><thead><tr><th>Person</th><th>Pick</th><th>Reason</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <section class="pn"><div class="pn-head"><span class="pn-id">?</span><h3>Ask someone</h3><span class="pn-meta">they get a focused card, not the thread</span></div><div class="pn-body newq">
        <div style="display:grid;grid-template-columns:180px 1fr;gap:8px"><select class="select" id="askto">${people.filter((h) => h !== "abtinokhovat").map((h) => `<option>@${h}</option>`).join("")}</select><input class="input" id="askq" placeholder="One question with a clear answer…" value="Does option C change anything for realtime push (ADR-0012)?"></div>
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="mono dim" style="font-size:11px">@advisor adds a TL;DR and answer choices</span><button class="btn btn--primary" data-act="ask">Send ask</button></div>
        ${S.sent.map((s) => `<div class="arg arg--q"><div class="arg-top">sent to ${esc(s.to)} · just now</div>${esc(s.q)}</div>`).join("")}</div></section>
    </div>
    <div style="display:grid;gap:18px">
      <section class="pn"><div class="pn-head"><span class="pn-id">%</span><h3>Consensus</h3><span class="pn-meta">bar = summed confidence</span></div><div class="pn-body cons">${cons}<div class="sep"></div><div style="font-size:13px"><b>Dissent:</b> @sara-dev (A) — replay will be needed soon.</div></div></section>
      <section class="agent-card pn" style="border-color:var(--agent)"><div class="brief"><p><b>Brief.</b> C wins on ops load and managed offer<sup>[1]</sup>; A wins on replay<sup>[2]</sup>. Nobody argues B after #6 (manual sharding)<sup>[3]</sup>. Reza’s 14-day replay need is met by C if raw rows are kept 14 days<sup>[4]</sup>.</p><p><b>Suggested decision:</b> C now, ADR-0004 as the scale path, revisit when replay &gt; 14 days.</p><p class="mono dim" style="font-size:11px">[1] #3 #8 #9 · [2] #1 #2 · [3] #6 · [4] q3 @reza-data</p></div></section>
      <section class="pn"><div class="pn-head"><span class="pn-id">✓</span><h3>Decide</h3></div><div class="pn-body"><div class="opick" style="grid-template-columns:1fr">${ST.options.map((o) => `<button class="${S.pick === o.key ? "on" : ""}" data-pick="${o.key}"><b>${o.key}</b> ${esc(o.name)} <span class="dim mono" style="float:right">${n[o.key]} picks</span></button>`).join("")}</div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn btn--green" data-act="decide">Decide ${S.pick} →</button></div></div></section>
    </div>
  </div>
  ${S.confirm ? confirmModal() : ""}`;
}

function confirmModal() {
  return `<div class="modal-bg"><div class="modal"><div class="pn-head"><span class="pn-id">✓</span><h3>Accept option ${S.pick} for ADR-0020?</h3></div><div class="pn-body" style="display:grid;gap:12px">
  <div class="lbl" style="margin:0">What @advisor will do</div>
  <div>${["Write docs/adr/0020-message-broker-for-v1.md from the arguments", "Record dissent from @sara-dev with trigger “replay > 14 days”", "Mark ADR-0004 as the scale path", "Open PR #42 and request review from consulted people", "Notify the team in #decisions"].map((s) => `<div class="check ok"><i>✓</i>${s}</div>`).join("")}</div>
  <div class="lbl" style="margin:0">Decision text (edit if you like)</div><textarea class="textarea">Run v1 without a broker. PostgreSQL holds the raw update table, job tables and the outbox. Keep raw rows 14 days. ADR-0004 stays the scale path.</textarea>
  <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="cancel">Cancel</button><button class="btn btn--green" data-act="accept">Accept and record</button></div></div></div></div>`;
}

function accepted() {
  return `<div class="accepted"><span class="pill pill--accepted">accepted · Oct 9</span><h2>ADR-0020 — v1 runs without a broker (option ${S.pick})</h2><p class="muted" style="margin:0">Decided by ${who("abtinokhovat")} · consulted @sara-dev, @mehdi-ops, @reza-data · 1 dissent recorded</p>
  <div class="chg">${["PR #42 merged: docs/adr/0020-message-broker-for-v1.md", "ADR-0004 → “Proposed — scale path”, linked both ways", "architecture.yaml: Message broker / Kafka shows ADR-0020", "Follow-up issue #51: raw table 14-day retention job", "Revisit trigger set: a consumer needs replay > 14 days → reopens ADR-0020", "Posted to #decisions with a 3-line summary"].map((s) => `<div><i>✓</i>${s}</div>`).join("")}</div>
  <div style="display:flex;gap:8px;margin-top:16px"><a class="btn" href="a-pull-request.html">Open the PR</a><button class="btn" data-reset>Replay demo</button></div></div>`;
}

// ── agent queue: agent proposes, humans approve ──
function queue() {
  const tasks = [
    { id: "t1", k: "verify claim", t: "#7 “NATS on Darkube is managed” — sent ask q2 to @mehdi-ops.", need: "waiting on @mehdi-ops", act: null },
    { id: "t2", k: "merge duplicate", t: "#4 (@lena-fe) says the same as #3 (@mehdi-ops).", diff: ["− Another cluster to watch for lag and disk", "+ (merged into #3) We would run 3 brokers ourselves"], act: "Apply" },
    { id: "t3", k: "draft reason", t: "#11 has a weak reason. Draft from ADR-0019:", diff: ["+ Mitigated by the relay spool (ADR-0019): ingress keeps accepting while the DB is down."], act: "Send to @sara-dev for approval" },
    { id: "t4", k: "rewrite", t: "Normalize 11 arguments into one style (short, active, one claim each).", act: "Preview" },
    { id: "t5", k: "write ADR", t: "Draft docs/adr/0020-*.md from picks and arguments once @abtinokhovat decides.", need: "waiting on decision", act: null },
  ];
  return `<section class="pn"><div class="pn-head" style="border-color:var(--agent)"><span class="pn-id" style="background:var(--agent)">AI</span><h3>@advisor queue · ADR-0020</h3><span class="pn-meta">agent proposes · people approve</span></div><div class="pn-body flush queue">${tasks.map((t, i) => `<div class="task ${S.tasks.has(t.id) ? "done" : ""}"><span class="opt-key" style="border-color:var(--agent);color:var(--agent)">${i + 1}</span><div><div class="k">${t.k}</div>${linkify(t.t)}${t.diff ? `<div class="diff">${t.diff.map((d) => `<span class="${d.startsWith("−") ? "del" : "add"}">${esc(d)}</span>`).join("")}</div>` : ""}</div><div>${S.tasks.has(t.id) ? `<span class="flag flag--ok">done</span>` : t.act ? `<button class="btn btn--sm btn--agent" data-task="${t.id}">${t.act}</button>` : `<span class="mono dim" style="font-size:11px">${t.need}</span>`}</div></div>`).join("")}</div></section>
  <p class="muted" style="font-size:12.5px;margin-top:10px">Every agent change is attributed, reversible, and shown in the thread. Changes to someone’s words go to that person first.</p>`;
}

function newModal() {
  return `<div class="modal-bg"><div class="modal"><div class="pn-head"><span class="pn-id">＋</span><h3>New decision</h3><span class="pn-meta">ADR-0021</span></div><div class="pn-body" style="display:grid;gap:12px">
  <div><div class="lbl">Question — one sentence ending in “?”</div><input class="input" value="Which transport pushes live inbox events to browsers: SSE, WebSocket or polling?"></div>
  <div><div class="lbl">Why now</div><textarea class="textarea">Realtime push is the last open piece for the inbox UI. Frontend starts next sprint.</textarea></div>
  <div style="display:grid;grid-template-columns:1fr 1fr 120px;gap:10px"><div><div class="lbl">Decider</div><select class="select"><option>@abtinokhovat</option></select></div><div><div class="lbl">Consult</div><input class="input" value="@lena-fe @sara-dev"></div><div><div class="lbl">Due</div><input class="input" value="Oct 18"></div></div>
  <div class="agent-card" style="padding:14px 12px 10px;font-size:13px"><b>@architect found context:</b> ${ref("0012")} ${ref("0013")} ${ref("0014")} and <span class="mono">services/inbox/realtime/</span>. I will draft 3 options (SSE, WebSocket, long polling) with pros and cons from the code. You review before anyone else sees them.</div>
  <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-act="closenew">Cancel</button><button class="btn btn--primary" data-act="create">Open decision &amp; draft options</button></div></div></div></div>`;
}

function render() {
  roles();
  const view = nav();
  document.getElementById("crumb").textContent = view === "room" ? "ADR-0020 · decision room" : view === "queue" ? "agent queue" : "asks for you";
  const m = document.getElementById("main");
  m.innerHTML = (view === "room" ? room() : view === "queue" ? queue() : inbox()) + (S.newOpen ? newModal() : "");
  const c = document.getElementById("conf");
  if (c) c.oninput = () => { S.conf = +c.value; document.getElementById("confv").textContent = `${S.conf}%`; };
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-role],[data-view],[data-ans],[data-pick],[data-act],[data-task],[data-new],[data-reset]");
  if (!t) return;
  e.preventDefault();
  if (t.dataset.role) { S.role = t.dataset.role; S.view = null; return render(); }
  if (t.dataset.view) { S.view = t.dataset.view; return render(); }
  if ("new" in t.dataset) { S.newOpen = true; return render(); }
  if ("reset" in t.dataset) { location.reload(); return; }
  if (t.dataset.ans) { S.cur = t.dataset.ans; return render(); }
  if (t.dataset.pick) { S.pick = t.dataset.pick; return render(); }
  if (t.dataset.task) { S.tasks.add(t.dataset.task); toast(t.textContent.includes("approval") ? "Sent to @sara-dev — applies when she approves" : "Applied · undo in the thread"); return render(); }
  const a = t.dataset.act;
  if (a === "submit") {
    const cur = MYASKS.find((x) => !S.answers[x.id]);
    if (!S.cur) return toast("Pick an answer first");
    S.answers[cur.id] = S.cur; S.cur = null;
    toast(`Sent to @${cur.from}. Added as an argument with your name.`);
    return render();
  }
  if (a === "later") return toast("Snoozed until tomorrow 10:00");
  if (a === "skip") return toast("Suggest who should answer: @sara-dev? @advisor forwards it with context");
  if (a === "nudge") return toast(`Focused ask sent to @${t.dataset.h}`);
  if (a === "ask") { S.sent.push({ to: document.getElementById("askto").value, q: document.getElementById("askq").value }); toast("Ask sent with a TL;DR and answer choices"); return render(); }
  if (a === "decide") { S.confirm = true; return render(); }
  if (a === "cancel") { S.confirm = false; return render(); }
  if (a === "accept") { S.confirm = false; S.decided = true; toast("ADR-0020 accepted"); return render(); }
  if (a === "closenew") { S.newOpen = false; return render(); }
  if (a === "create") { S.newOpen = false; S.drafted = true; toast("ADR-0021 opened · @architect is drafting options (you review first)"); return render(); }
});
render();
</script>
</body>
</html>
