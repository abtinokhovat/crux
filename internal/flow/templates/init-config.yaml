# crux config — https://github.com/abtinokhovat/crux
# Any .md file with a "crux: <kind>" header (service, store, flow, contract, entity, question…)
# anywhere in the repo joins the graph. No naming convention; put them next to the code.
title: {{name}}
dir: docs/adr                         # ADR markdown files: NNNN-kebab-title.md
components: .crux/components          # project components: *.mjs exporting { name, render }
template: .crux/template.md           # used by "crux new" (falls back to the built-in one)
docs: []                              # extra plain-markdown folders to index, e.g. [docs/design]
prefix: ADR
# architecture: docs/adr/architecture.yaml   # optional hand-drawn map; crux files are enough
# catalog: .crux/catalog.yaml         # add or recolor technologies and transports
# scan:
#   exclude: [testdata, fixtures]     # folders the header scan and code scan skip (.gitignore is read too)
# lint:
#   adapters: [go, ts, infra]         # code facts for "crux lint --code"; or a command printing facts JSON
#   topics: ['bus\.Emit\("([^"]+)"']  # extra patterns, one capture group = topic name
#   ignore: [code-route-undeclared]   # rule names, element ids or file globs to silence
# share: https://crux.example.com     # share server for meeting notes and team review (crux login <url> --token …)
# statuses:                           # add or recolor statuses (ok|info|warn|err|mute|purple|#hex)
#   piloting: { label: Piloting, color: purple, order: 3 }
# tags:
#   kafka: { desc: Event log and streaming }
