  node:        { label: Node.js, category: runtime, color: "#5FA04E", icon: nodedotjs, aliases: [nodejs] }
  deno:        { label: Deno, category: runtime, color: "#1E1E1E", icon: deno }
  bun:         { label: Bun, category: runtime, color: "#3B3024", icon: bun }
