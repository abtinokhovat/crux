  markdown: { label: Markdown, category: tool, color: "#1E1E1E", icon: markdown }
  protobuf: { label: Protocol Buffers, category: tool, color: "#244C5A", aliases: [proto], detect: { go: [google.golang.org/protobuf], npm: [protobufjs, "@bufbuild/protobuf"] } }
  bazel:    { label: Bazel, category: tool, color: "#43A047", icon: bazel }

# How a connection is drawn. mode: sync | async | stream | data | trigger
transports:
  http:      { label: HTTP, mode: sync, aliases: [rest, https] }
  grpc:      { label: gRPC, mode: sync, aliases: [rpc, connect] }
  graphql:   { label: GraphQL, mode: sync, aliases: [gql] }
  trpc:      { label: tRPC, mode: sync }
  tcp:       { label: TCP, mode: sync }
  udp:       { label: UDP, mode: async }
  ws:        { label: WebSocket, mode: stream, aliases: [websocket] }
  sse:       { label: SSE, mode: stream }
  topic:     { label: Topic, mode: async, aliases: [event, events, kafka, stream] }
  queue:     { label: Queue, mode: async, aliases: [job, jobs, amqp, sqs] }
  webhook:   { label: Webhook, mode: async, aliases: [hook, callback] }
  sql:       { label: SQL, mode: data }
  kv:        { label: Key-value, mode: data, aliases: [cache, redis] }
  blob:      { label: Blob, mode: data, aliases: [s3, file, files] }
  search:    { label: Search, mode: data }
  cron:      { label: Schedule, mode: trigger, aliases: [schedule, timer] }
  call:      { label: In-process call, mode: sync, aliases: [func, inproc] }
