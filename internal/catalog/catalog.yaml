# crux catalog: technologies, categories and transports. Every entry styles itself:
# category → shape, tech → color + icon (Simple Icons slug, CC0), transport → edge style.
# Projects extend or override entries in .crux/catalog.yaml (same shape).
# detect: { go: [module prefixes], npm: [package names], image: [docker image names] }

categories:
  language:      { label: Language, shape: card }
  runtime:       { label: Runtime, shape: card }
  framework:     { label: Framework, shape: card }
  store:         { label: Database, shape: cylinder }
  kv:            { label: Key-value store, shape: cylinder }
  search:        { label: Search, shape: cylinder }
  blob:          { label: Object storage, shape: cylinder }
  cache:         { label: Cache, shape: cylinder }
  broker:        { label: Message broker, shape: pipe }
  workflow:      { label: Workflow engine, shape: pipe }
  gateway:       { label: Gateway / proxy, shape: card }
  auth:          { label: Identity, shape: card }
  observability: { label: Observability, shape: card }
  cloud:         { label: Cloud / platform, shape: card }
  saas:          { label: External service, shape: card }
  ai:            { label: AI provider, shape: card }
  protocol:      { label: Protocol, shape: card }
  client:        { label: Client, shape: card }
  tool:          { label: Tool, shape: card }

tech:
