  java:        { label: Java, category: language, color: "#B07219", icon: openjdk }
  kotlin:      { label: Kotlin, category: language, color: "#7F52FF", icon: kotlin }
  rust:        { label: Rust, category: language, color: "#B7410E", icon: rust }
  dotnet:      { label: .NET, category: runtime, color: "#512BD4", icon: dotnet, aliases: [csharp, "c#"] }
  ruby:        { label: Ruby, category: language, color: "#CC342D", icon: ruby }
  php:         { label: PHP, category: language, color: "#777BB4", icon: php }
