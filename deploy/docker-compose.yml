# crux share server behind Caddy (automatic HTTPS). Set your domain and secrets, then:
#   docker compose up -d
services:
  crux:
    image: ghcr.io/abtinokhovat/crux:latest   # or: build: ..
    restart: unless-stopped
    environment:
      CRUX_TOKENS: "abtinokhovat:CHANGE-ME-long-random-token"   # handle:token, comma-separated for more owners
      CRUX_PASSCODE: "CHANGE-ME-team-passcode"                   # teammates enter this once per browser
      CRUX_PUBLIC_URL: "https://crux.example.com"
    volumes:
      - crux-data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from crux.example.com --to crux:8080
    volumes:
      - caddy-data:/data
volumes:
  crux-data:
  caddy-data:
